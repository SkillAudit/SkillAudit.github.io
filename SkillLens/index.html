<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to SkillAudit</title>
  <link rel="canonical" href="https://skillaudit.github.io/">
  <meta http-equiv="refresh" content="0; url=https://skillaudit.github.io/">
  <script>
    const target = new URL("https://skillaudit.github.io/");
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.toString());
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://skillaudit.github.io/">SkillAudit</a>.</p>
</body>
</html>
